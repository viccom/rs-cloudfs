# cydrive 多卷模式 · 进程级配置示例（`cydrive setup --multi` 生成同款骨架）
#
# 用法：复制为本目录 config.toml，volumes/ 下每个 <name>.toml 一个卷
# （文件名即卷名，须匹配 ^[a-z][a-z0-9_-]{0,31}$），然后 `cydrive run`。
#
# 本文件只允许进程级键（8 个）——出现任何卷级键（backend、凭据、加密、
# 路径、盘符等）会在启动时报 mixing 错误。进程级键对进程内所有卷统一生效。
# 注意：多卷模式下 CYDRIVE_* 环境变量覆盖被忽略（K28，防跨卷串味），
# 每卷凭据走 卷文件 > 各自环境变量 > keyring 的解析链。

# ── 多卷开关 ────────────────────────────────────────────────────────────────
volumes_dir = "volumes"          # 相对/绝对均可；设了它 = 多卷模式

# ── 服务端口（进程共享一个 WebDAV/dashboard；卷在 /vol/<name> 下）─────────
webdav_host = "127.0.0.1"
webdav_port = 8485               # 默认 8080
web_ui_host = "127.0.0.1"
web_ui_port = 8486               # 默认 8088
enable_web_ui = true

# ── 挂载形态（进程级：管本进程所有卷的挂载方式）───────────────────────────
mount_backend = "winfsp"         # 默认 "webdav"；winfsp 需 --features winfsp 构建 + WinFsp 运行时
auto_mount_drive = true          # 进程级总闸：false 则所有卷都不自动挂载
