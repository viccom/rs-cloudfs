# cargo-deny configuration (M6 release pipeline).
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Analyze all targets (Windows + Linux) so target-specific deps
# (keyring windows-native / sync-secret-service, winreg, ...) are covered.
all-features = true

# The GPL-3.0 winfsp pair is excluded from cargo-deny's graphs BY NAME
# (K89, 2026-09-25): since the owner's decision the `winfsp` feature
# ships in cloudkit-cli's default — the Windows binary deliberately
# links winfsp-rs (private, self-hosted distribution). This exclusion
# keeps `all-features = true` usable and the strong-copyleft
# allow-list below clean for everything ELSE. Consequences stated
# honestly: the excluded crates are invisible to licenses, advisories
# and bans alike; winfsp-sys is bindgen output plus a vendored DLL
# import lib with no independent source/advisory feed; the compensating
# control is cloudkit-winfsp's own test suite, which runs in the main
# CI Windows leg and compiles and exercises exactly the excluded
# subtree. Driver-pruned builds (K30) and every Linux/macOS target
# (cfg(windows) gate) stay winfsp-free. Any future crate added to this
# list needs the same statement of edge, reachability and compensation.
exclude = ["winfsp", "winfsp-sys"]

[licenses]
# Version of SPDX spec to use.
version = 2

# Licenses actually encountered in the dependency tree across BOTH
# targets (host windows-msvc and x86_64-unknown-linux-gnu). Strong
# copyleft stays out of the allow list on principle: everything checked
# here keeps the MIT-tree posture. The one GPL exception is handled at
# the graph level, not here — the GPL-3.0 winfsp/winfsp-sys pair
# (excluded above since K89 ships them in the default Windows binary)
# never reaches this check. Note the one MPL-2.0 crate
# (htmlescape, via keyring) — file-level weak copyleft, fine to
# redistribute in binary form, MPL-covered files must keep their source
# available upstream (they are).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "MPL-2.0",
    # webpki-roots (sync client https, via hyper-rustls): the Mozilla
    # root certificate bundle ships under this single permissive data
    # license — not copyleft, no obligations on MIT binaries.
    "CDLA-Permissive-2.0",
    # rustls stack (sync client https): ring is "Apache-2.0 AND ISC",
    # rustls-webpki and untrusted are ISC-only — a permissive OSI
    # license, MIT-equivalent.
    "ISC",
]

# Vendored grammers-session is consumed as a path dependency; its
# Cargo.toml carries `license = "MIT OR Apache-2.0"` (texts restored in
# crates/vendor/grammers-session/LICENSE-*), so it passes the license
# check without any exception entry.

[sources]
# Only crates.io (plus the workspace itself and vendored path deps)
# may provide dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
# Multiple versions of the same crate are noisy but not a blocker;
# duplicates of security-sensitive crates would be flagged below.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[advisories]
# Vulnerability database: unmaintained crates and RustSec advisories
# fail the check (default behavior for v2 config format).
version = 2
yanked = "deny"
