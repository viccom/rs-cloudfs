# cargo-deny configuration (M6 release pipeline).
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Analyze all targets (Windows + Linux) so target-specific deps
# (keyring windows-native / sync-secret-service, winreg, ...) are covered.
all-features = true

# K38 license isolation (docs/plans/2026-09-10-phase3-winfsp.md §1): the
# `winfsp` feature is off by default, but `all-features = true` above
# means this check would otherwise drag the GPL-3.0 winfsp-rs bindings
# into the graph. The two crates are excluded from the *license* graph by
# name — deliberately both, so the exclusion is exactly as wide as the
# GPL edge: winfsp (the bindings) and winfsp-sys (bindgen output + the
# vendored DLL import lib). Everything they pull in (bytemuck,
# parking_lot, paste, static_assertions, widestring, windows) stays in
# the graph and is checked as usual; nothing else is exempted, so the
# default tree remains MIT-only. The mechanical half of the isolation —
# "the default feature graph contains no winfsp at all" — lives in CI
# (.github/workflows/ci.yml, the `cargo tree --prefix none --format
# "{lib}"` step), because a dependency edge of an *enabled* feature is
# not something cargo-deny can assert.
#
# Scope note (review cross-L7, RB4): a `[graph] exclude` entry removes
# the named crates from EVERY cargo-deny check, not only licenses —
# advisories and bans too. That is the deliberate K38 trade: both crates
# are feature-gated (`winfsp`, default off) out of every shipped graph —
# the default build, the driver-pruned builds (K30) and CI's default
# target — so nothing they could flag reaches a shipped binary;
# winfsp-sys is bindgen output plus a vendored DLL import lib with no
# independent source/advisory feed of its own; and the compensating
# controls are the CI `cargo tree` assertion above plus the winfsp leg's
# own test suite, which compile and exercise exactly the excluded
# subtree. Any future crate added to this list needs the same statement
# of edge, reachability and compensation.
exclude = ["winfsp", "winfsp-sys"]

[licenses]
# Version of SPDX spec to use.
version = 2

# Licenses actually encountered in the dependency tree across BOTH
# targets (host windows-msvc and x86_64-unknown-linux-gnu). GPL/AGPL/LGPL
# and other strong-copyleft licenses are intentionally absent: CyDrive
# ships as MIT and must stay that way. Note the one MPL-2.0 crate
# (htmlescape, via keyring) — file-level weak copyleft, fine to
# redistribute in binary form, MPL-covered files must keep their source
# available upstream (they are).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "MPL-2.0",
    # webpki-roots (sync client https, via hyper-rustls): the Mozilla
    # root certificate bundle ships under this single permissive data
    # license — not copyleft, no obligations on MIT binaries.
    "CDLA-Permissive-2.0",
    # rustls stack (sync client https): ring is "Apache-2.0 AND ISC",
    # rustls-webpki and untrusted are ISC-only — a permissive OSI
    # license, MIT-equivalent.
    "ISC",
]

# Vendored grammers-session is consumed as a path dependency; its
# Cargo.toml carries `license = "MIT OR Apache-2.0"` (texts restored in
# crates/vendor/grammers-session/LICENSE-*), so it passes the license
# check without any exception entry.

[sources]
# Only crates.io (plus the workspace itself and vendored path deps)
# may provide dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
# Multiple versions of the same crate are noisy but not a blocker;
# duplicates of security-sensitive crates would be flagged below.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[advisories]
# Vulnerability database: unmaintained crates and RustSec advisories
# fail the check (default behavior for v2 config format).
version = 2
yanked = "deny"
