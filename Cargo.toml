[workspace]
resolver = "2"
members = [
    "crates/cloudkit-storage",
    "crates/cloudkit-crypto",
    "crates/cloudkit-core",
    "crates/cloudkit-sync-server",
    "crates/cloudkit-cli",
    "crates/cloudkit-platform",
    "crates/cloudkit-web",
    "crates/cloudkit-webdav",
    "crates/drivers/ck-telegram",
]
# Not a member on purpose: an external path dependency keeps rustc's
# cap-lints=allow for upstream code (fmt/clippy gates stay ours), while
# the exclude below also allows running its own tests standalone.
# examples/baidu_spike: Batch S verification spike (live Baidu network
# calls) — must never enter CI gates; run manually via
# `cargo run --manifest-path examples/baidu_spike/Cargo.toml --release --`.
exclude = ["crates/vendor/grammers-session", "examples/baidu_spike"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Redirect every grammers-session consumer in the graph — including the
# transitive dependency from grammers-client — to the in-tree vendored
# copy whose sqlite-storage backend is rusqlite(bundled) instead of
# libsql, so the whole workspace links exactly one SQLite C library.
# See crates/vendor/grammers-session/VENDOR.md.
[patch.crates-io]
grammers-session = { path = "crates/vendor/grammers-session" }

# cargo-dist release-packaging config (M6). Latest cargo-dist at config
# time: 0.32.0 (2026-05-21). To cut a release, run on a machine with
# network access:
#   cargo install cargo-dist --locked --version 0.32.0
#   cargo dist plan     # dry-run sanity check
#   cargo dist build    # local artifact build
#   cargo dist manifest # inspect the resolved configuration
# NOTE: not executed in this environment (tool not installed); this
# config is committed ahead of the first real release. `ci = false`
# keeps cargo-dist from generating its own GitHub workflows — CI gates
# live in .github/workflows/ci.yml and releases are cut manually.
[workspace.metadata.dist]
version = "0.32.0"
ci = false
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
