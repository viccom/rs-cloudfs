[package]
name = "cloudkit-web"
description = "CyDrive web dashboard: the six-route aiohttp UI contract on axum"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Exact pin, mirroring the dav-server precedent for HTTP frameworks:
# the dashboard contract was written against 0.8 route syntax.
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "multipart",
    "tokio",
] }
cloudkit-core = { path = "../cloudkit-core" }
# Streaming download body (SR2 / K36): Body::from_stream takes any
# futures-core Stream, and the frames are bytes::Bytes — the same
# lock-tree versions the transport seam already uses.
bytes = "1"
futures-core = "0.3"
mime_guess = "2"
rust-embed = "8"
serde_json = "1"
thiserror = "2"
# "time" since the web volume management P0: the command seam's read
# budget (5s) — a wedged volume command must not park the dashboard.
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
# RT3 read-through face tests: the wide-face transport double exposes a
# counting storage driver through the `as_driver` probe (D1) — the mock
# driver and the trait live in L2, test-only (production graph unchanged).
async-trait = "0.1"
cloudkit-storage = { path = "../cloudkit-storage" }
tempfile = "3"
