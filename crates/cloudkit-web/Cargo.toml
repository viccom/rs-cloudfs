[package]
name = "cloudkit-web"
description = "CyDrive web dashboard: the six-route aiohttp UI contract on axum"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Exact pin, mirroring the dav-server precedent for HTTP frameworks:
# the dashboard contract was written against 0.8 route syntax.
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "multipart",
    "tokio",
] }
cloudkit-core = { path = "../cloudkit-core" }
# Streaming download body (SR2 / K36): Body::from_stream takes any
# futures-core Stream, and the frames are bytes::Bytes — the same
# lock-tree versions the transport seam already uses.
bytes = "1"
futures-core = "0.3"
mime_guess = "2"
rust-embed = "8"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
