[package]
name = "cydrive-cli"
description = "CyDrive binary: minimal run orchestration (config discovery, VFS + transport + WebDAV boot)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "cydrive_cli"
path = "src/lib.rs"

[[bin]]
name = "cydrive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8.0.0"
cydrive-core = { path = "../cydrive-core" }
cydrive-platform = { path = "../cydrive-platform" }
cydrive-telegram = { path = "../cydrive-telegram" }
cydrive-web = { path = "../cydrive-web" }
cydrive-webdav = { path = "../cydrive-webdav" }
dialoguer = "0.12.0"
# OS credential vault (M5). keyring 3.x has no default features: the
# platform store must be picked per target below (the base dep keeps the
# crate linkable everywhere; CyDrive's supported platforms all carry a
# real store in the target sections).
keyring = "3"
thiserror = "2"
# net/io-util/time/sync: the control channel's loopback listener, line
# protocol, 3s connect deadline and STOP notification channel
# (control.rs) — previously arrived only transitively through the
# workspace graph.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "io-util",
    "time",
    "sync",
] }
tracing = "0.1"

# Platform credential stores: Windows Credential Manager, macOS Keychain,
# and the DBus Secret Service on Linux (pure-Rust crypto; persistence
# across reboots, unlike the session-scoped keyutils `linux-native`).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# e2e (sync-lite Batch B4): spawn the real sync server — the cydrive-sync
# router served by axum on an ephemeral loopback port (same feature set
# as cydrive-sync's own axum entry, so feature unification keeps one set).
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
cydrive-sync = { path = "../cydrive-sync" }
tempfile = "3"
# lib deps already union in rt-multi-thread/macros/signal plus the
# control channel's net/io-util/time; the e2e tests' explicit rt/macros
# entry stays as the test-side base (net/io-util below are now redundant
# but kept as the historical feature list of the raw-TCP tests).
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
