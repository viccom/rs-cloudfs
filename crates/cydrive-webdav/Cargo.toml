[package]
name = "cydrive-webdav"
description = "CyDrive WebDAV layer: DavFileSystem adapter over the VFS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
cydrive-core = { path = "../cydrive-core" }
dav-server = "=0.11.0"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
