[package]
name = "cydrive-webdav"
description = "CyDrive WebDAV layer: DavFileSystem adapter over the VFS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
cloudkit-core = { path = "../cloudkit-core" }
dav-server = "=0.11.0"
futures-util = "0.3"
http = "1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
