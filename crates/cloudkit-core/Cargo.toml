[package]
name = "cloudkit-core"
description = "CyDrive domain core: VFS paths, metadata DB, cache, crypto, chunking"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1"
bytes = "1"
# L3→L2 合法依赖（architecture §1）：transport trait 家族与 StorageError
# 分类学的家（Batch R 迁入）；本 crate 以 re-export 维持既有路径兼容。
cloudkit-storage = { path = "../cloudkit-storage" }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
pbkdf2 = "0.13.0"
rand = "0.10.2"
# "hooks": Connection::update_hook — the files-table change doorbell
# (wake chokepoint batch); not a rusqlite default feature.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }
toml = "1.1.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
