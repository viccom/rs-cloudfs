[package]
name = "cloudkit-core"
description = "CyDrive domain core: VFS paths, metadata DB, cache, crypto, chunking"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
# L3→L2 合法依赖（architecture §1）：transport trait 家族与 StorageError
# 分类学的家（Batch R 迁入）；本 crate 以 re-export 维持既有路径兼容。
cloudkit-storage = { path = "../cloudkit-storage" }
# 加密方案 crate（Batch E 迁入）：crypto 定位 L2 侧基础能力，被 core
# 消费不算违规（architecture §1.5 注）；core/src/crypto.rs 为兼容 shim。
cloudkit-crypto = { path = "../cloudkit-crypto" }
futures-core = "0.3"
# "std" unlocks FutureExt::catch_unwind (std-gated in futures-util) — the
# upload worker's panic-isolation seam (K58-M1); the stream::unfold call
# in upload_v2_stream needs no features on its own.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.10.2"
# "hooks": Connection::update_hook — the files-table change doorbell
# (wake chokepoint batch); not a rusqlite default feature.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }
# "preserve_order": toml::Table keeps the file's key order (IndexMap)
# instead of sorting — render_volume_toml (web volume management P1)
# re-renders a volume file's explicit keys in the hand-written order, so
# a DISABLE/ENABLE rewrite only ever moves the one overlaid key.
toml = { version = "1.1.4", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
