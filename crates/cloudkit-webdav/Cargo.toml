[package]
name = "cloudkit-webdav"
description = "CyDrive WebDAV layer: DavFileSystem adapter over the VFS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
cloudkit-core = { path = "../cloudkit-core" }
dav-server = "=0.11.0"
futures-util = "0.3"
http = "1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
thiserror = "2"
# stream-M1 (review RB4): the short-window warn in `fill_window`.
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync"] }

[dev-dependencies]
# RT3 read-through face tests: the wide-face transport double exposes a
# counting storage driver through the `as_driver` probe (D1) — the mock
# driver and the trait live in L2, test-only (production graph unchanged).
async-trait = "0.1"
cloudkit-storage = { path = "../cloudkit-storage" }
tempfile = "3"
