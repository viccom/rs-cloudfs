[package]
name = "cloudkit-storage"
description = "CyDrive storage abstraction: StorageDriver contract, vocabulary types, conformance suite"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt", "macros"] }
