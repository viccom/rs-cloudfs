[package]
name = "cydrive-telegram"
description = "CloudTransport implementation over Telegram MTProto (grammers); pure contract logic first"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
cydrive-core = { path = "../cydrive-core" }
futures-core = "0.3"
# `stream::unfold` wraps the update-forwarding channel into the boxed
# `IncomingStream` shape (same crate/features as cydrive-core uses).
futures-util = { version = "0.3", default-features = false }
# Exact `=` pins: grammers treats minor versions as breaking (TL layer
# changes), so any semver-compatible drift must be a deliberate upgrade.
# The `proxy` feature forwards to grammers-mtsender/proxy (tokio-socks) and
# unlocks `ConnectionParams::proxy_url` for SOCKS5 transport.
grammers-client = { version = "=0.10.0", features = ["proxy"] }
# Redirected by the workspace [patch.crates-io] to the in-tree vendored copy
# (crates/vendor/grammers-session) whose sqlite-storage backend is
# rusqlite(bundled) — same SQLite cydrive-core links — instead of libsql.
# sqlite-storage is now needed by transport.rs for file-backed persistence;
# default-features stays off to keep the feature set explicit.
grammers-session = { version = "=0.10.0", default-features = false, features = [
    "sqlite-storage",
] }
thiserror = "2"
# "sync" feeds the update receiver (mpsc) kept from the SenderPool.
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
