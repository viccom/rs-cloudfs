[package]
name = "cloudkit-winfsp"
description = "WinFsp native-mount adapter over the VFS (L5; GPL-3.0 bindings behind the `winfsp` feature — default-on in the shipped binary since K89)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# K89 (2026-09-25, owner decision): default-on in the shipped binary
# via cloudkit-cli's `default`. The feature stays optional so
# `--no-default-features` builds (K30 driver pruning, the CI `none`
# leg) keep a winfsp-free graph, and the target gate below keeps every
# Linux/macOS build winfsp-free regardless.
[features]
winfsp = ["dep:winfsp", "dep:windows", "dep:futures-util"]

[dependencies]
cloudkit-core = { path = "../cloudkit-core" }
# `ByteStream` aggregation in the window reader (StreamExt::next). Feature-
# gated with the rest of the read path so the default graph gains nothing.
futures-util = { version = "0.3", optional = true }
# tokio::runtime::Handle — the async bridge (bridge.rs) — plus the
# await-aware read lock (fs.rs: a window fetch holds it across an await,
# the same shape as ck-baidu's refresh single-flight lock). `rt` + `sync`
# alone are enough: the adapter never builds a runtime, it borrows the
# process one (the mount assembly in WF4 owns it).
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

# WinFsp bindings (winfsp-rs) plus the windows-rs facade it speaks.
# Target-gated on purpose: the Linux CI leg must never even resolve
# them, even with the feature on. Both are optional — see `[features]`.
#
# windows must stay on the same 0.61 line winfsp depends on, otherwise
# the two NTSTATUS types are distinct and every error return stops
# compiling (spike lesson 12).
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13.1", optional = true }
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[dev-dependencies]
# RT3 read-through face tests: the wide-face transport double exposes a
# counting storage driver through the `as_driver` probe (D1) — the mock
# driver and the trait live in L2, test-only (production graph unchanged).
async-trait = "0.1"
cloudkit-storage = { path = "../cloudkit-storage" }
tempfile = "3"
# The H4 probe captures the adapter's own tracing events (log-semantics
# assertions) through a thread-local fmt subscriber with a buffer writer.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
# The integration tests assemble a real Vfs (whose upload queue spawns
# tasks) and drive the async bridge, so they need the multi-thread
# runtime + time.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
] }
