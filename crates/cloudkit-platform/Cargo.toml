[package]
name = "cloudkit-platform"
description = "Platform glue for CyDrive: Windows WebDAV drive mapping and WebClient registry tuning (cross-platform letter logic plus cfg-gated Windows implementation)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Only for `auto_mount_target`'s `&CyDriveConfig` decision input
# (status plan C5); the rest of this crate stays a pure platform leaf.
cloudkit-core = { path = "../cloudkit-core" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# 0.55 does not exist on crates.io; 0.56 is the newest 0.5x line.
winreg = "0.56"
