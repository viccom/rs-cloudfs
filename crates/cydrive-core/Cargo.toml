[package]
name = "cydrive-core"
description = "CyDrive domain core: VFS paths, metadata DB, cache, crypto, chunking"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
pbkdf2 = "0.13.0"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
toml = "1.1.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.151"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
