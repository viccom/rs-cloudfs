[package]
name = "cloudkit-cli"
description = "CyDrive binary: minimal run orchestration (config discovery, VFS + transport + WebDAV boot)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "cloudkit_cli"
path = "src/lib.rs"

[[bin]]
name = "cydrive"
path = "src/main.rs"

# Driver feature gates (K30, docs/plans/2026-09-09-driver-feature-gates.md):
# the default set is all-on — byte-identical behavior to the pre-gate
# binary. `telegram` (FT1), `baidu` (FT2) and `local` (FT3) are wired to
# their dependencies; a build without a driver feature produces a binary
# that refuses that driver's surfaces at runtime with the actionable
# rebuild message (K31).
[features]
default = ["telegram", "baidu", "local", "sftp", "pan115"]
telegram = ["dep:ck-telegram"]
baidu = ["dep:ck-baidu"]
local = ["dep:ck-local"]
sftp = ["dep:ck-sftp"]
pan115 = ["dep:ck-pan115"]
# WinFsp mount backend (Phase 3, K38/K40): OFF by default and it must
# stay out of `default` — enabling it pulls the GPL-3.0 winfsp-rs
# bindings into the graph, and the release artifacts must stay GPL-free.
# WF4 wires the actual `mount_backend = "winfsp"` dispatch; WF1 lands the
# dependency edge, the feature forwarding, and build.rs' delay-load link
# args (the shipped exe is the artifact that needs them).
winfsp = ["dep:cloudkit-winfsp", "cloudkit-winfsp/winfsp"]

[dependencies]
anyhow = "1"
# Implementing core's #[async_trait] SyncClient seam for the HTTP client.
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8.0.0"
cloudkit-core = { path = "../cloudkit-core" }
cloudkit-platform = { path = "../cloudkit-platform" }
# L2 vocab + StorageDriver face: the rebuild driver assembly types
# (composition root may name drivers and L2 — R1 exemption).
cloudkit-storage = { path = "../cloudkit-storage" }
# The telegram driver is feature-gated (K30): `default` keeps it on, so
# the released binary is unchanged; `--no-default-features` (or a
# `default-features = false` build without `telegram`) produces a binary
# that refuses telegram surfaces at runtime with the actionable rebuild
# message (K31, `cloudkit_cli::TELEGRAM_DRIVER_REQUIRED`).
ck-telegram = { path = "../drivers/ck-telegram", optional = true }
# The baidu driver is feature-gated (K30, FT2): `default` keeps it on,
# so the released binary is unchanged; a build without `baidu` produces
# a binary that refuses baidu surfaces at runtime with the actionable
# rebuild message (K31, `cloudkit_cli::BAIDU_DRIVER_REQUIRED`) and
# doctor skips the baidu liveness probe.
# rebuild 子命令的 build_driver helper 直接调两驱动工厂（B3b 段二a
# 最小装配；段二b dispatch 单元收编/复用——R1 组合根豁免）。
ck-baidu = { path = "../drivers/ck-baidu", optional = true }
# The local driver is feature-gated (K30, FT3): `default` keeps it on,
# so the released binary is unchanged; a build without `local` produces
# a binary that refuses local surfaces at runtime with the actionable
# rebuild message (K31, `cloudkit_cli::LOCAL_DRIVER_REQUIRED`).
ck-local = { path = "../drivers/ck-local", optional = true }
# The sftp driver is feature-gated (K30 pattern, Phase 4 SF3): `default`
# keeps it on; a build without `sftp` produces a binary that refuses
# sftp surfaces at runtime with the actionable rebuild message (K31,
# `cloudkit_cli::SFTP_DRIVER_REQUIRED`). The whole russh protocol stack
# rides this gate — a build without it resolves none of it.
ck-sftp = { path = "../drivers/ck-sftp", optional = true }
# The pan115 driver is feature-gated (K30 pattern, Phase 5 / 115-1 —
# this batch ships the crate skeleton + auth layer; the dispatch wiring
# lands in 115-4, whose arms refuse loudly until then). `default` keeps
# it on like every driver before it; a build without `pan115` refuses
# pan115 surfaces with the actionable rebuild message (K31,
# `cloudkit_cli::PAN115_DRIVER_REQUIRED`).
ck-pan115 = { path = "../drivers/ck-pan115", optional = true }
cloudkit-web = { path = "../cloudkit-web" }
cloudkit-webdav = { path = "../cloudkit-webdav" }
# WinFsp native mount adapter (Phase 3, L5). Optional and feature-gated
# (K38): the default build does not resolve it, let alone link it.
cloudkit-winfsp = { path = "../cloudkit-winfsp", optional = true }
# Sync-lite client (Batch B4): the wire types this CLI maps onto core's
# sync engine at runtime.
cloudkit-sync-server = { path = "../cloudkit-sync-server" }
dialoguer = "0.12.0"
# Request/response types for the sync HTTP client (already in the lock
# tree via the axum/hyper graph — zero new packages for Cargo.lock).
bytes = "1"
http = "1"
http-body-util = "0.1"
# Real-HTTP sync client (hyper-util legacy client; same feature set
# cloudkit-sync-server's own e2e tests use).
hyper-util = { version = "0.1", default-features = false, features = [
    "client",
    "client-legacy",
    "http1",
    "tokio",
] }
# https for the sync client (sync review High④): rustls TLS wrapped
# around the hyper-util connector. aws-lc-rs default excluded on
# purpose — the ring provider's Windows build chain is lighter; the
# Mozilla (webpki) root store means public-CA certificates are
# trusted and self-signed ones are not (documented: tunnel for
# those). Licenses Apache-2.0/ISC/MIT across the rustls stack, plus
# the permissive CDLA-Permissive-2.0 data license of webpki-roots
# (see deny.toml) — cargo-deny re-checks.
hyper-rustls = { version = "0.27", default-features = false, features = [
    "native-tokio",
    "http1",
    "tls12",
    "ring",
    "webpki-roots",
] }
serde_json = "1"
# The CREATE/UPDATE payload conversion builds core's `toml::Table`
# (render_volume_toml's input type). The `preserve_order` feature MUST
# match core's — toml's Table is a different concrete type (IndexMap vs
# BTreeMap) without it, and a mismatched build would not compile. Same
# version line as core; already in the lock tree, zero new packages
# (web volume management P3).
toml = { version = "1.1.4", features = ["preserve_order"] }
# OS credential vault (M5). keyring 3.x has no default features: the
# platform store must be picked per target below (the base dep keeps the
# crate linkable everywhere; CyDrive's supported platforms all carry a
# real store in the target sections).
keyring = "3"
thiserror = "2"
# net/io-util/time/sync: the control channel's loopback listener, line
# protocol, 3s connect deadline and STOP notification channel
# (control.rs) — previously arrived only transitively through the
# workspace graph.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "io-util",
    "time",
    "sync",
] }
# FutureExt::catch_unwind only: the control loop's panic isolation around
# an installed volume-command handler (control.rs, review M1-1) — the
# same 0.3 line cloudkit-webdav/web already carry (already in the lock
# tree, zero new packages).
futures-util = "0.3"
# Local-time HH:MM:SS for the REBUILD already-running reply (web volume
# management P2/R1) — clock-only, no serde; already in the lock tree
# via dav-server/grammers, zero new packages.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"

# Platform credential stores: Windows Credential Manager, macOS Keychain,
# and the DBus Secret Service on Linux (pure-Rust crypto; persistence
# across reboots, unlike the session-scoped keyutils `linux-native`).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# e2e (sync-lite Batch B4): spawn the real sync server — the cloudkit-sync-server
# router served by axum on an ephemeral loopback port (same feature set
# as cloudkit-sync-server's own axum entry, so feature unification keeps one set).
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
tempfile = "3"
# Log-capture subscriber for the boot-banner test (R-5 capability
# declaration); same 0.3 line the workspace already uses, fmt-only.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
# lib deps already union in rt-multi-thread/macros/signal plus the
# control channel's net/io-util/time; the e2e tests' explicit rt/macros
# entry stays as the test-side base (net/io-util below are now redundant
# but kept as the historical feature list of the raw-TCP tests).
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
