# CyDrive CI (M6). Quality gates for every push/PR on both supported
# desktop platforms: architecture/secret gates (R1/R3), fmt, clippy
# (deny warnings), full test suite.
#
# NOTE (honesty): this workflow has NOT been triggered yet — it was
# committed from a dev environment with no push access. Expect
# first-run calibration. In particular:
#   - Linux system deps: none are expected to be needed. SQLite is
#     compiled from source by rusqlite's "bundled" feature (needs only a
#     C toolchain, preinstalled on ubuntu-latest), and keyring's
#     sync-secret-service backend talks D-Bus through zbus, a pure-Rust
#     client (no libdbus). If the first Linux run fails on a missing
#     system library, add the apt-get step here and record the lesson.
#   - Windows: MSVC toolchain is preinstalled on windows-latest.

name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: R1/R3 gates + fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the secret-scan step diffs the event range
          # (base/before commits), which needs more than depth 1.
          fetch-depth: 0

      # R1 mechanical gate (architecture.md §2): no crate outside
      # crates/drivers/* — except the cloudkit-cli composition root —
      # may depend on a driver crate. OS-independent by nature, but run
      # on both matrix OSes anyway: sub-second cost and it exercises the
      # script under Git Bash on windows too.
      - name: layer check (R1)
        run: sh scripts/check_layers
        shell: bash

      # R3 minimal gate: grep the ADDED lines of this push/PR for
      # credential-shaped literals (mode selection + force-push/first-push
      # fallbacks live in the script). Minimal home-grade pattern set,
      # extendable in scripts/scan_secrets.
      - name: secret scan (R3)
        run: sh scripts/scan_secrets
        shell: bash

      # Matches rust-toolchain.toml (channel = "stable").
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cache cargo registry + target dir across runs; keys off the
      # lockfile automatically.
      - uses: Swatinem/rust-cache@v2

      # K38 license-isolation gate (phase 3 plan §1): the winfsp feature
      # is off by default, so the GPL-3.0 bindings must not be reachable
      # from the default graph at all. cargo-deny alone cannot assert this
      # (deny.toml excludes the two crates by name so `all-features` stays
      # usable), hence the mechanical tree check. `--prefix none --format
      # "{lib}"` prints the bare library name per line — the default
      # format also prints the source path, which would match this
      # repository's own checkout path on a worktree whose directory name
      # contains "winfsp".
      - name: winfsp isolation (K38)
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree -p cloudkit-cli --prefix none --format "{lib}" | grep -qi winfsp; then
            echo "::error::cloudkit-cli's default graph contains winfsp"; exit 1
          fi
          if cargo tree --workspace --prefix none --format "{lib}" | grep -v '^cloudkit_winfsp$' | grep -qi winfsp; then
            echo "::error::the GPL winfsp bindings reached the default workspace graph"; exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Driver feature gates (K30–K32,
  # docs/plans/2026-09-09-driver-feature-gates.md): the features live
  # only in cloudkit-cli, so the matrix clippy-checks the composition
  # root alone — the all-off build plus each single-driver subset — and
  # runs the workspace test suite once with the default features off.
  # The default-feature legs are the `check` job above; one OS suffices
  # here because feature selection is OS-independent.
  features:
    name: feature gates (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: none
            features: ""
          - label: telegram
            features: "--features telegram"
          - label: baidu
            features: "--features baidu"
          - label: local
            features: "--features local"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy (-p cloudkit-cli --no-default-features ${{ matrix.features }})
        run: cargo clippy -p cloudkit-cli --no-default-features ${{ matrix.features }} --all-targets -- -D warnings

      # The all-off build doubles as the feature-matrix test leg: the
      # whole workspace suite against a build with every driver feature
      # off (driver-gated tests cfg out; everything else stays green).
      - name: cargo test --workspace --no-default-features
        if: matrix.label == 'none'
        run: cargo test --workspace --no-default-features

  # WinFsp feature leg (Phase 3, K38/K40): the `winfsp` feature is off
  # everywhere else — the default graph must stay free of the GPL-3.0
  # bindings — so this is the only place the winfsp-rs code is compiled
  # and tested. Windows-only by construction: winfsp-sys' build script
  # panics on any other target, and cloudkit-winfsp's own target gate
  # makes the feature inert elsewhere anyway.
  #
  # NOTE (honesty, same as the file header): this job has NOT been run on
  # a real runner yet. First-run calibration items:
  #   - winfsp-sys generates its bindings with bindgen, which needs
  #     libclang: the step below points LIBCLANG_PATH at the runner's
  #     LLVM and falls back to `choco install llvm` if a future image
  #     drops it.
  #   - the tests must pass WITHOUT WinFsp installed: they never call a
  #     WinFsp DLL export (see crates/cloudkit-winfsp/tests/metadata.rs).
  #     If a test fails with exit 0xc06d007e (STATUS_DLL_NOT_FOUND, the
  #     delay-load stub aborting), something reached the DLL — that is
  #     the bug to fix, not the runner.
  #   - delay-load linking means `cargo build` needs only the vendored
  #     import lib, which ships inside winfsp-sys.
  winfsp:
    name: winfsp feature leg (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: libclang for winfsp-sys (bindgen)
        shell: pwsh
        run: |
          $candidates = @("$env:ProgramFiles\LLVM\bin", "${env:ProgramFiles(x86)}\LLVM\bin")
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "libclang.dll") } | Select-Object -First 1
          if (-not $found) {
            choco install llvm -y
            $found = "$env:ProgramFiles\LLVM\bin"
          }
          "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: cargo clippy (-p cloudkit-winfsp --features winfsp)
        run: cargo clippy -p cloudkit-winfsp --features winfsp --all-targets -- -D warnings

      - name: cargo clippy (-p cloudkit-cli --features winfsp)
        run: cargo clippy -p cloudkit-cli --features winfsp --all-targets -- -D warnings

      - name: cargo test (-p cloudkit-winfsp --features winfsp)
        run: cargo test -p cloudkit-winfsp --features winfsp

      - name: cargo build (-p cloudkit-cli --features winfsp)
        run: cargo build -p cloudkit-cli --features winfsp
